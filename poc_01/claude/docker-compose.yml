version: "3.8"

# Brings up Postgres, the monitoring service, and all 6 mock device
# simulators — one command gets the whole demo running, directly
# answering "must be able to get it up and running quick and easy" on
# unfamiliar trade-show hardware.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: poc
      POSTGRES_USER: poc
      POSTGRES_PASSWORD: poc
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poc"]
      interval: 5s
      timeout: 3s
      retries: 5

  monitoring-service:
    build: ./monitoring-service
    environment:
      DATABASE_URL: postgres://poc:poc@db:5432/poc
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  router:
    build: ./devices
    command: node router/index.js
    ports: ["4001:4001"]

  switch:
    build: ./devices
    command: node switch/index.js
    ports: ["4002:4002"]

  camera-rest:
    build: ./devices
    command: node camera-rest/index.js
    ports: ["4003:4003"]

  door-access-rest:
    build: ./devices
    command: node door-access-rest/index.js
    ports: ["4004:4004"]

  camera-grpc:
    build: ./devices
    command: node camera-grpc/index.js
    ports: ["4005:4005"]

  door-access-grpc:
    build: ./devices
    command: node door-access-grpc/index.js
    ports: ["4006:4006"]
