<text x="286.66666666666663" y="526" text-anchor="middle" font-size="11.5" fill="#1a202c">checkHealth(address)   attempt 2</text>
<line x1="463.3333333333333" y1="584" x2="640.0" y2="584" stroke="#2b6cb0" stroke-width="1.8" marker-end="url(#a)"/>
<text x="551.6666666666666" y="578" text-anchor="middle" font-size="11.5" fill="#1a202c">GET /health, GET /diagnostics</text>
