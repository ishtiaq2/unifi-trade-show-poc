<line x1="110.0" y1="792" x2="286.66666666666663" y2="792" stroke="#2b6cb0" stroke-width="1.8" marker-end="url(#a)"/>
<text x="198.33333333333331" y="786" text-anchor="middle" font-size="11.5" fill="#1a202c">updateStatus(id, reachable, 0)</text>
<line x1="286.66666666666663" y1="844" x2="993.3333333333333" y2="844" stroke="#2b6cb0" stroke-width="1.8" marker-end="url(#a)"/>
<text x="640.0" y="838" text-anchor="middle" font-size="11.5" fill="#1a202c">UPDATE devices SET status = ...</text>
<line x1="110.0" y1="896" x2="286.66666666666663" y2="896" stroke="#2b6cb0" stroke-width="1.8" marker-end="url(#a)"/>
<text x="198.33333333333331" y="890" text-anchor="middle" font-size="11.5" fill="#1a202c">recordDiagnostics(id, payload)</text>
<line x1="286.66666666666663" y1="948" x2="993.3333333333333" y2="948" stroke="#2b6cb0" stroke-width="1.8" marker-end="url(#a)"/>
<text x="640.0" y="942" text-anchor="middle" font-size="11.5" fill="#1a202c">INSERT INTO diagnostics ...</text>
<rect x="-30.0" y="984" width="280" height="38" fill="#fefcbf" stroke="#d69e2e" rx="3"/>
<text x="110.0" y="1000" text-anchor="middle" font-size="11" font-style="italic">status changed from previous cycle?</text>
<text x="110.0" y="1014" text-anchor="middle" font-size="11" font-style="italic">log the transition, not every check</text>
